<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红颜·局中局 - 核销页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            margin: 0;
            padding: 20px;
            background-color: #f8f8f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #d43030;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .token-display {
            background-color: #eee;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            word-break: break-all;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
            color: #fff;
            background-color: #d43030;
            border: none;
        }
        .btn:hover {
            background-color: #c22b2b;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .fallback-message {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>红颜·局中局 - 核销凭证</h1>
        <p>您的核销凭证已准备就绪，请点击下方按钮前往小程序进行核销。</p>
        <div class="token-display" id="tokenDisplay"></div>
        <div class="button-group">
            <button class="btn" id="openMiniProgramBtn">打开抖音小程序核销</button>
            <button class="btn btn-secondary" id="copyTokenBtn">复制凭证并手动打开小程序</button>
        </div>
        <p class="fallback-message hidden" id="fallbackMessage">
            如果无法自动打开小程序，请手动打开抖音 App，搜索“红颜·局中局”小程序，进入核销页面粘贴凭证。
        </p>
        <p id="oidDisplay" class="hidden" style="font-size: 12px; color: #aaa; margin-top: 20px;"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
