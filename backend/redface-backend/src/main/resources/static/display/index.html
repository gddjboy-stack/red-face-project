<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>红颜局中局 · 人气榜</title>
<!--
  C20-8 人气榜大屏（横向长条版）

  版式基准：1400 × 可变高（现场反馈）。宽度按 1400 设计，但一律用相对单位，
  换分辨率不变形。

  为什么字这么大：观众在手机上看直播。1400px 的条在 1920px 画面中占 73%，
  到 400px 宽的手机屏上只剩约 290px —— 大屏上看着很大的字，观众端会缩到约 1/5。
  因此字号按"缩小 5 倍后仍可辨认"倒推，不按"电脑上看着舒服"来定。

  三条不可动的红线：
  1）排序一律沿用后端返回顺序，前端绝不重排（合规）
  2）不出现任何买家个人信息
  3）不出现"打榜/应援/冲榜"等诱导性表述

  零外部依赖：不引 CDN 字体、不引 html2canvas。现场断网也能用。
-->
<style>
:root{
  --ink:#0B0710;
  --ink-2:#150E1B;
  --line:rgba(215,154,57,.16);
  --gold:#D79A39;
  --gold-hi:#F7D488;
  --rose:#E0577F;
  --rose-dim:#8E4460;
  --text:#F7F2F5;
  --dim:#8E8290;
  --danger:#E06A6A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
  overflow:hidden;
}

/* ================= 令牌闸门 ================= */
#gate{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,#241A26 0%,#0B0710 70%);
}
.gate-card{
  width:min(92vw,440px);padding:40px 34px;text-align:center;
  background:var(--ink-2);border:1px solid var(--line);border-radius:14px;
}
.gate-title{font-size:22px;font-weight:600;letter-spacing:2px;color:var(--gold-hi)}
.gate-sub{margin-top:10px;font-size:13px;line-height:1.7;color:var(--dim)}
.gate-card input{
  width:100%;margin-top:22px;padding:13px 14px;font-size:16px;
  background:var(--ink);color:var(--text);
  border:1px solid var(--line);border-radius:8px;
}
.gate-card input:focus{outline:none;border-color:var(--gold)}
#gateBtn{
  width:100%;margin-top:16px;padding:13px;font-size:16px;font-weight:600;
  background:linear-gradient(90deg,#D79A39,#F2C069);
  color:#2B1D08;border:none;border-radius:8px;cursor:pointer;
}
#gateBtn:disabled{opacity:.55;cursor:default}
#gateError{min-height:20px;margin-top:14px;font-size:13px;color:var(--danger)}

/* ================= 主画面 ================= */
#stage{display:none;height:100%;flex-direction:column;padding:0 clamp(16px,1.6vw,28px)}
#stage.on{display:flex}

/* 顶栏：一行放完，不占高 */
.top{
  flex:0 0 auto;display:flex;align-items:baseline;gap:clamp(12px,1.4vw,22px);
  padding:clamp(10px,1.2vh,18px) 2px clamp(8px,1vh,14px);
  border-bottom:1px solid var(--line);
}
.title{
  font-size:clamp(22px,2.4vw,34px);font-weight:800;letter-spacing:.06em;
  color:var(--gold-hi);white-space:nowrap;
}
.round{
  font-size:clamp(15px,1.5vw,22px);color:var(--dim);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.live-dot{
  display:inline-block;width:.62em;height:.62em;margin-right:.5em;border-radius:50%;
  background:var(--rose);box-shadow:0 0 0 0 rgba(224,87,127,.55);
  animation:pulse 2s infinite;
}
.live-dot.idle{background:#4A424C;box-shadow:none;animation:none}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(224,87,127,.5)}
  70%{box-shadow:0 0 0 .7em rgba(224,87,127,0)}
  100%{box-shadow:0 0 0 0 rgba(224,87,127,0)}
}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{
  padding:7px 14px;font-size:13px;color:var(--dim);
  background:transparent;border:1px solid var(--line);border-radius:7px;cursor:pointer;
}
.btn:hover{color:var(--gold-hi);border-color:var(--gold)}

/* 榜体：可拖动滚动，隐藏滚动条（OBS 画面里不该出现滚动条） */
#scroller{
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:none;-ms-overflow-style:none;
  scroll-behavior:smooth;cursor:grab;
}
#scroller::-webkit-scrollbar{display:none}
#scroller.dragging{cursor:grabbing;scroll-behavior:auto}
#board{padding:var(--gap) 0}

.row{
  display:grid;
  grid-template-columns:var(--w-rank) var(--w-name) 1fr var(--w-val);
  align-items:center;
  gap:clamp(10px,1vw,20px);
  height:var(--rowh);
  margin-bottom:var(--gap);
  padding:0 clamp(10px,1vw,18px);
  background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border-left:3px solid transparent;
  border-radius:8px;
}
.row.r1{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(215,154,57,.16),rgba(215,154,57,.03))}
.row.r2{border-left-color:#B9A9C2;background:linear-gradient(90deg,rgba(185,169,194,.12),rgba(185,169,194,.02))}
.row.r3{border-left-color:var(--rose-dim);background:linear-gradient(90deg,rgba(224,87,127,.12),rgba(224,87,127,.02))}

.rank{
  font-size:var(--fs-rank);font-weight:800;color:var(--dim);
  text-align:center;font-variant-numeric:tabular-nums;line-height:1;
}
.row.r1 .rank{color:var(--gold-hi)}
.row.r2 .rank{color:#D8CCE0}
.row.r3 .rank{color:#EE8FAC}

.who{min-width:0}
.who .nm{
  font-size:var(--fs-name);font-weight:800;letter-spacing:.02em;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.who .no{
  display:inline-block;margin-right:.4em;padding:0 .34em;
  font-size:.62em;font-weight:700;color:var(--gold-hi);
  border:1px solid var(--line);border-radius:4px;vertical-align:.12em;
  font-variant-numeric:tabular-nums;
}
.who .tm{
  margin-top:.25em;font-size:var(--fs-team);color:var(--dim);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 柱条：本页的主角。刻度线让人一眼估出差距，不是装饰 */
.track{position:relative;height:var(--barh);border-radius:calc(var(--barh)/2);background:rgba(255,255,255,.055);overflow:hidden}
.track::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,
    transparent 0,transparent calc(25% - 1px),
    rgba(255,255,255,.11) calc(25% - 1px),rgba(255,255,255,.11) 25%);
}
.bar{
  height:100%;border-radius:inherit;
  background:linear-gradient(90deg,var(--rose-dim),var(--rose));
  transition:width .6s cubic-bezier(.22,.61,.36,1);
}
.row.r1 .bar{background:linear-gradient(90deg,#C4862A,var(--gold-hi))}
.row.r2 .bar{background:linear-gradient(90deg,#7E7188,#CBBDD4)}
.row.r3 .bar{background:linear-gradient(90deg,#8E4460,#F09CB6)}

.val{
  font-size:var(--fs-val);font-weight:800;text-align:right;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1;
}
.row.r1 .val{color:var(--gold-hi)}

.empty{padding:8vh 0;text-align:center;font-size:clamp(18px,2vw,28px);color:var(--dim)}

/* 底栏 */
.foot{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:clamp(6px,.9vh,12px) 2px clamp(8px,1.1vh,14px);
  font-size:clamp(11px,1.05vw,15px);color:var(--dim);
  border-top:1px solid var(--line);
}
.foot .err{color:var(--danger)}
.foot .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.hint{opacity:.62}

#shareWrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.86)}
#shareWrap.on{display:flex}
#shareWrap .inner{text-align:center}
#shareCanvas{max-width:min(86vw,420px);max-height:74vh;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
#shareWrap .ops{margin-top:16px;display:flex;gap:12px;justify-content:center}

@media (prefers-reduced-motion:reduce){
  .bar{transition:none}
  .live-dot{animation:none}
  #scroller{scroll-behavior:auto}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-title">红颜局中局 · 人气榜</div>
    <div class="gate-sub">本页为对外展示画面，仅可读取榜单。<br/>请输入展示令牌（与后台管理口令不同）。</div>
    <input id="tokenInput" type="password" placeholder="请输入展示令牌" autocomplete="off" />
    <button id="gateBtn">进入展示</button>
    <div id="gateError"></div>
  </div>
</div>

<div id="stage">
  <div class="top">
    <div class="title" id="boardTitle">选手人气榜</div>
    <div class="round"><span class="live-dot" id="liveDot"></span><span id="roundText">—</span></div>
    <div class="top-right">
      <button class="btn" id="tabBtn">切到 团队榜</button>
      <button class="btn" id="fsBtn">全屏</button>
      <button class="btn" id="shareBtn">生成分享图</button>
      <button class="btn" id="logoutBtn">退出</button>
    </div>
  </div>

  <div id="scroller"><div id="board"></div></div>

  <div class="foot">
    <span id="updateText">—</span><span class="err" id="errText"></span>
    <span class="right">
      <span class="hint" id="zeroHint"></span>
      <span class="hint" id="scrollHint"></span>
      <span id="pageTag"></span>
    </span>
  </div>
</div>

<div id="shareWrap">
  <div class="inner">
    <canvas id="shareCanvas" width="1080" height="1440"></canvas>
    <div class="ops">
      <button class="btn" id="saveShareBtn">保存图片</button>
      <button class="btn" id="closeShareBtn">关闭</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   契约不变：
   GET  /api/display/board?tab=player|team
   POST /api/display-auth/session   {token}
   POST /api/display-auth/logout
   401 → 回闸门；429 → 限流提示
   ============================================================ */
var POLL_INTERVAL_MS = 3000;
var AUTO_SCROLL_MS   = 6000;   // 自动翻屏间隔
var MANUAL_PAUSE_MS  = 20000;  // 人工拖动后暂停自动滚动的时长

var state = {
  tab:'player', items:[], roundName:'', liveStatus:'', failCount:0,
  pausedUntil:0, maxValue:0
};
var pollTimer=null, scrollTimer=null;
var $=function(id){return document.getElementById(id);};

/* ---------- 请求 ---------- */
function apiGet(path){
  return fetch(path,{method:'GET',credentials:'same-origin',headers:{'Accept':'application/json'}})
    .then(function(res){
      if(res.status===401){var e=new Error('UNAUTHORIZED');e.unauthorized=true;throw e;}
      if(!res.ok){throw new Error('HTTP '+res.status);}
      return res.json();
    }).then(function(b){
      if(b.code!==0){throw new Error(b.message||'接口返回异常');}
      return b.data;
    });
}

/* ---------- 换票 ---------- */
function submitToken(){
  var token=$('tokenInput').value.trim();
  if(!token){$('gateError').textContent='请输入展示令牌';return;}
  $('gateBtn').disabled=true;$('gateError').textContent='';
  fetch('/api/display-auth/session',{
    method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:token})
  }).then(function(res){
    return res.json().then(function(b){return {status:res.status,body:b};});
  }).then(function(r){
    if(r.status===200&&r.body.code===0){
      $('tokenInput').value='';   // 令牌用后即清，防拍屏外泄
      enterStage();return;
    }
    $('gateError').textContent = r.status===429
      ? (r.body.message||'尝试次数过多，请稍后再试')
      : (r.body.message||'令牌错误');
  }).catch(function(){
    $('gateError').textContent='无法连接服务端，请检查网络或服务状态';
  }).then(function(){$('gateBtn').disabled=false;});
}

function enterStage(){$('gate').style.display='none';$('stage').classList.add('on');layout();startPolling();}
function backToGate(msg){
  stopPolling();$('stage').classList.remove('on');
  $('gate').style.display='flex';
  $('gateError').textContent=msg||'凭证已失效，请重新输入展示令牌';
}

/* ---------- 轮询 ---------- */
function startPolling(){
  fetchBoard();
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(fetchBoard,POLL_INTERVAL_MS);
  if(scrollTimer)clearInterval(scrollTimer);
  scrollTimer=setInterval(autoScroll,AUTO_SCROLL_MS);
}
function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;}
}

function fetchBoard(){
  apiGet('/api/display/board?tab='+encodeURIComponent(state.tab)).then(function(d){
    state.items=d.items||[];
    state.roundName=d.roundName;
    state.liveStatus=d.liveStatus;
    state.failCount=0;
    $('errText').textContent='';
    render();
  }).catch(function(e){
    if(e.unauthorized){backToGate('凭证已失效或被撤销，请重新输入展示令牌');return;}
    // 单次失败不清屏：直播中瞬时抖动导致榜面变空白，比显示略旧数据更糟
    state.failCount+=1;
    $('errText').textContent=' · 刷新失败 '+state.failCount+' 次，画面为最近一次成功数据';
  });
}

/* ---------- 自适应版式 ----------
   目标：人数少时行更高更好看，人数多时压缩到仍可辨认的下限，
   超出可视范围才滚动。所有尺寸由行高派生，保证比例一致。      */
var MIN_ROW=88, MAX_ROW=150;

function layout(){
  var stage=$('stage');
  if(!stage.classList.contains('on'))return;
  var scroller=$('scroller');
  var avail=scroller.clientHeight;
  var n=Math.max(state.items.length,1);
  var gap=Math.max(6,Math.round(avail*0.012));
  var raw=Math.floor((avail-gap)/n)-gap;
  var rowh=Math.min(MAX_ROW,Math.max(MIN_ROW,raw));

  var W=stage.clientWidth;
  var root=stage.style;
  root.setProperty('--rowh',rowh+'px');
  root.setProperty('--gap',gap+'px');
  root.setProperty('--barh',Math.round(rowh*0.34)+'px');
  root.setProperty('--w-rank',Math.round(Math.max(46,W*0.045))+'px');
  root.setProperty('--w-name',Math.round(Math.max(150,W*0.22))+'px');
  root.setProperty('--w-val',Math.round(Math.max(120,W*0.17))+'px');
  root.setProperty('--fs-rank',Math.round(rowh*0.40)+'px');
  root.setProperty('--fs-name',Math.round(rowh*0.36)+'px');
  root.setProperty('--fs-team',Math.round(rowh*0.19)+'px');
  root.setProperty('--fs-val',Math.round(rowh*0.38)+'px');

  var fits=(rowh+gap)*n<=avail;
  $('scrollHint').textContent=fits?'':'可上下拖动查看其余选手';
}

/* ---------- 渲染 ---------- */
function render(){
  $('boardTitle').textContent=state.tab==='team'?'团队人气榜':'选手人气榜';
  $('tabBtn').textContent=state.tab==='team'?'切到 选手榜':'切到 团队榜';

  var isLive=state.liveStatus==='live';
  $('liveDot').className='live-dot'+(isLive?'':' idle');
  $('roundText').textContent=isLive?((state.roundName||'进行中')+' · 实时'):'暂无进行中的轮次';

  var board=$('board');
  if(!state.items.length){
    board.innerHTML='<div class="empty">暂无榜单数据</div>';
    $('scrollHint').textContent='';$('pageTag').textContent='';
    return;
  }

  // 柱长基准取当前最大值；全为 0 时不画柱，避免除零后满格误导
  var max=0;
  for(var k=0;k<state.items.length;k++){ if(state.items[k].value>max)max=state.items[k].value; }
  state.maxValue=max;
  /* C20-9：全 0 时必须明说「暂未产生人气数据」。
     否则画面是「有名次、有名字、柱子全空、数字全 0」，
     与「系统挂了 / 数据没传上来」在观众和运营眼里完全无法区分。 */
  $('zeroHint').textContent = max===0 ? '本轮暂未产生人气数据' : '';

  var html='';
  for(var i=0;i<state.items.length;i++){
    var it=state.items[i];
    var cls=it.rank===1?' r1':(it.rank===2?' r2':(it.rank===3?' r3':''));
    var pct=max>0?Math.max(2,Math.round(it.value/max*100)):0;
    var no=(state.tab==='team'||it.number===null||it.number===undefined)
      ? '' : '<span class="no">'+pad2(it.number)+'</span>';
    var team=state.tab==='team'?'':'<div class="tm">'+esc(it.teamName||'未分组')+'</div>';
    html+='<div class="row'+cls+'">'
        +   '<div class="rank">'+it.rank+'</div>'
        +   '<div class="who"><div class="nm">'+no+esc(it.name||'—')+'</div>'+team+'</div>'
        +   '<div class="track"><div class="bar" style="width:'+pct+'%"></div></div>'
        +   '<div class="val">'+fmt(it.value)+'</div>'
        + '</div>';
  }
  board.innerHTML=html;
  $('updateText').textContent='每 '+(POLL_INTERVAL_MS/1000)+' 秒自动刷新 · 最近更新 '+nowText()+' · 共 '+state.items.length+' 条';
  layout();
}

/* ---------- 自动滚动 ----------
   人工拖动后暂停一段时间，避免"运营正看着，画面自己跑了" */
function autoScroll(){
  var sc=$('scroller');
  if(Date.now()<state.pausedUntil)return;
  var over=sc.scrollHeight-sc.clientHeight;
  if(over<=4){$('pageTag').textContent='';return;}
  var step=Math.max(sc.clientHeight*0.8,120);
  var next=sc.scrollTop+step;
  /* C20-9 修复末屏永不展示：
     旧写法 if(next>=over-2)next=0 把「下一步会超出」直接当成「已经到底」，
     于 step > over 时（如 12 人榜 step=787、over=240）首次翻屏即归零，
     末尾名次一整场都不会出现在观众眼前。
     正确语义分两步：先夹到底部完整停一屏，已经在底部了才回到顶部。 */
  if(sc.scrollTop>=over-2){
    next=0;                        // 已停在底部一整屏，回到顶部重新循环
  }else if(next>over){
    next=over;                     // 下一步会超出，先夹到底部把末屏完整展示一轮
  }
  sc.scrollTop=next;
  updatePageTag();
}
function updatePageTag(){
  var sc=$('scroller');
  var over=sc.scrollHeight-sc.clientHeight;
  if(over<=4){$('pageTag').textContent='';return;}
  var pct=Math.round(sc.scrollTop/over*100);
  $('pageTag').textContent='已看到 '+Math.min(100,Math.max(0,pct))+'%';
}
function pauseAuto(){state.pausedUntil=Date.now()+MANUAL_PAUSE_MS;}

/* ---------- 鼠标拖动（触屏用原生滚动即可） ---------- */
(function(){
  var sc=$('scroller'),down=false,startY=0,startTop=0;
  sc.addEventListener('mousedown',function(e){
    down=true;startY=e.clientY;startTop=sc.scrollTop;
    sc.classList.add('dragging');pauseAuto();e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){
    if(!down)return;sc.scrollTop=startTop-(e.clientY-startY);updatePageTag();
  });
  window.addEventListener('mouseup',function(){
    if(!down)return;down=false;sc.classList.remove('dragging');
  });
  sc.addEventListener('wheel',function(){pauseAuto();setTimeout(updatePageTag,60);},{passive:true});
  sc.addEventListener('touchstart',function(){pauseAuto();},{passive:true});
  sc.addEventListener('scroll',function(){updatePageTag();},{passive:true});
})();

/* ---------- 分享图：原生 Canvas 手绘，零依赖 ---------- */
var shareLogo=new Image();
shareLogo.src='assets/logo-full-880.png';

function drawShareImage(){
  var c=$('shareCanvas'),ctx=c.getContext('2d'),W=c.width,H=c.height;
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#221826');g.addColorStop(.55,'#120D15');g.addColorStop(1,'#0B0710');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#D79A39';ctx.fillRect(0,0,W,8);

  var logoBottom=96;
  if(shareLogo&&shareLogo.complete&&shareLogo.naturalWidth>0){
    var lw=300,lh=lw*shareLogo.naturalHeight/shareLogo.naturalWidth;
    ctx.drawImage(shareLogo,(W-lw)/2,40,lw,lh);logoBottom=40+lh;
  }else{
    ctx.textAlign='center';ctx.fillStyle='#D79A39';
    ctx.font='500 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('红 颜 局 中 局',W/2,108);
  }

  ctx.textAlign='center';ctx.fillStyle='#F7F2F5';
  ctx.font='700 76px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(state.tab==='team'?'团队人气榜':'选手人气榜',W/2,logoBottom+66);
  ctx.fillStyle='#8E8290';ctx.font='400 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText((state.roundName?state.roundName+' · ':'')+dateText(),W/2,logoBottom+114);

  var list=state.items.slice(0,10);
  var top=logoBottom+156,rowH=96,padX=72;
  if(!list.length){
    ctx.fillStyle='#8E8290';ctx.font='400 34px "PingFang SC",sans-serif';
    ctx.fillText('暂无榜单数据',W/2,top+120);
  }
  var max=0;for(var m=0;m<list.length;m++){if(list[m].value>max)max=list[m].value;}

  for(var i=0;i<list.length;i++){
    var it=list[i],y=top+i*rowH;
    ctx.fillStyle=i===0?'rgba(215,154,57,.14)':'rgba(255,255,255,.035)';
    ctx.fillRect(padX,y,W-padX*2,rowH-14);

    ctx.textAlign='center';
    ctx.fillStyle=i===0?'#F7D488':(i===1?'#D8CCE0':(i===2?'#EE8FAC':'#8E8290'));
    ctx.font='800 40px "PingFang SC",sans-serif';
    ctx.fillText(String(it.rank),padX+46,y+54);

    ctx.textAlign='left';ctx.fillStyle='#F7F2F5';
    ctx.font='700 38px "PingFang SC","Microsoft YaHei",sans-serif';
    var nm=(state.tab!=='team'&&it.number!=null?pad2(it.number)+' ':'')+(it.name||'—');
    ctx.fillText(cut(ctx,nm,300),padX+92,y+54);

    // 柱条
    var bx=padX+412,bw=W-padX*2-412-180,bh=18,by=y+(rowH-14)/2-bh/2;
    ctx.fillStyle='rgba(255,255,255,.06)';
    roundRect(ctx,bx,by,bw,bh,bh/2);ctx.fill();
    if(max>0){
      var w=Math.max(bh,Math.round(it.value/max*bw));
      var bg=ctx.createLinearGradient(bx,0,bx+w,0);
      if(i===0){bg.addColorStop(0,'#C4862A');bg.addColorStop(1,'#F7D488');}
      else{bg.addColorStop(0,'#8E4460');bg.addColorStop(1,'#E0577F');}
      ctx.fillStyle=bg;roundRect(ctx,bx,by,w,bh,bh/2);ctx.fill();
    }

    ctx.textAlign='right';
    ctx.fillStyle=i===0?'#F7D488':'#F7F2F5';
    ctx.font='800 38px "PingFang SC",sans-serif';
    ctx.fillText(fmt(it.value),W-padX-16,y+54);
  }

  ctx.textAlign='center';ctx.fillStyle='#6F6572';
  ctx.font='400 24px "PingFang SC",sans-serif';
  ctx.fillText('数据以最终结算为准',W/2,H-46);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function cut(ctx,s,maxW){
  if(ctx.measureText(s).width<=maxW)return s;
  while(s.length>1&&ctx.measureText(s+'…').width>maxW)s=s.slice(0,-1);
  return s+'…';
}

/* ---------- 工具 ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return String(n==null?0:n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function pad2(n){return n<10?('0'+n):String(n);}
function two(n){return n<10?'0'+n:''+n;}
function nowText(){var d=new Date();return two(d.getHours())+':'+two(d.getMinutes())+':'+two(d.getSeconds());}
function dateText(){var d=new Date();return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())+' '+two(d.getHours())+':'+two(d.getMinutes());}

/* ---------- 事件 ---------- */
$('gateBtn').addEventListener('click',submitToken);
$('tokenInput').addEventListener('keydown',function(e){if(e.key==='Enter')submitToken();});
$('tabBtn').addEventListener('click',function(){
  state.tab=state.tab==='team'?'player':'team';
  $('scroller').scrollTop=0;pauseAuto();fetchBoard();
});
$('shareBtn').addEventListener('click',function(){drawShareImage();$('shareWrap').classList.add('on');});
$('closeShareBtn').addEventListener('click',function(){$('shareWrap').classList.remove('on');});
$('saveShareBtn').addEventListener('click',function(){
  var a=document.createElement('a');
  a.download='人气榜_'+dateText().replace(/[-: ]/g,'')+'.png';
  a.href=$('shareCanvas').toDataURL('image/png');a.click();
});
$('logoutBtn').addEventListener('click',function(){
  fetch('/api/display-auth/logout',{method:'POST',credentials:'same-origin'})
    .catch(function(){}).then(function(){backToGate('已退出展示');});
});

/* ---------- C20-9 全屏 ----------
   开播前导播必做的动作。浏览器要求 requestFullscreen 必须由真实点击触发，
   无法用代码自动进入，因此这个按钮不可省。 */
function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
$('fsBtn').addEventListener('click',function(){
  if(isFullscreen()){
    (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
  }else{
    var el=document.documentElement;
    (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
  }
});
/* 全屏前后可视高度差很多，不重算就会出现行高沿用旧值、末行被截的情况。 */
function onFsChange(){$('fsBtn').textContent=isFullscreen()?'退出全屏':'全屏';layout();}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);

/* ---------- C20-9 启动探活 ----------
   Cookie 有效期 12 小时内刷新页面不应再要人手输令牌。
   OBS 崩溃重载、误按 F5、切场景重新加载都会走到这里，
   若不探活，大屏会卡在令牌闸门等人，而现场往往没人有空去输。 */
fetch('/api/display/ping',{method:'GET',credentials:'same-origin',headers:{'Accept':'application/json'}})
  .then(function(res){return res.status===200?res.json():null;})
  .then(function(body){
    if(body&&body.code===0){enterStage();return;}
    $('tokenInput').focus();
  })
  .catch(function(){$('tokenInput').focus();});

window.addEventListener('resize',layout);
</script>
